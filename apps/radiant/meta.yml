decisions:
  - APP_MODE=flat APP_SUBDIR=inst/app - inst/app is a directory app inside the R package; global.R resolves every radiant.* module through system.file() and server.R calls library(radiant), so this is the "package whose app directory does library()" case, not package-deploy
  - FORCED_PKGS=the six radiant packages - a silent CRAN miss must fail the build instead of shipping a navbar with a dead module
  - EXTRA_PKGS=radiant radiant.data radiant.design radiant.basics radiant.model radiant.multivariate - closure is CRAN-only (1.6.7/1.6.9/1.6.6/1.6.6/1.6.13/1.6.9), no Bioconductor, no GitHub-only, no archived packages
  - EXCLUDE=rsconnect,tests,for.shinyapps.io.R - rsconnect is shinyapps.io metadata, tests/ is a ShinyDriver script, for.shinyapps.io.R is a dev helper whose commented library() lines would seed the dependency scanner
  - STRICT_DEPS=on - unresolved dependencies fail the build
  - SMOKE=on - the built bundle must serve an HTML page before the Release is created
  - MAX_REQUEST_MB=1024 - radiant imports user data files, so the upload cap needs headroom
  - PANDOC_VERSION empty - Report > Rmd/R needs pandoc on the user's machine; the template only verifies pandoc on the runner and does not ship it
  - SOURCE_REBUILD empty, PKG_VERSION_* empty - nothing recompiled for portability and no vendored dylibs, so no version suffix is allocated
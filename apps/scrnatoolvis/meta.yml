decisions:
  - flat bundle of inst/shinyapp; scRNAtoolVis is installed from the pinned v0.1.1 archive and the app reads package functions and data from that installed package
  - qs2 replaces the archived qs package; .rds and .qs2 uploads are supported, legacy .qs is not compatible with qs2
  - GitHub-only dependencies jjAnno, jjPlot and ggunchull are installed from pinned archive tarballs; SOFT_PKGS bypasses the CRAN/Bioc index and FORCED_PKGS verifies installation
  - macOS is deferred because the ggunchull dependency chain fails on macos-14; the current workflow publishes win-x64 only
  - catalog publish is pending a GitHub Release with a bundle asset; a successful CI artifact alone is not a catalog asset

decisions:
  - PLATFORMS=win-x64 mac-arm64 - Cairo/XQuartz solved by vendoring X11 dylibs into rlib/<pkg>/libs
  - SOFT_PKGS=BSgenome hg38 mm10 - 731 + 650 MB over the 2 GiB limit with a 484-package closure
  - ON-DEMAND TF genome - first use of the TF module downloads one genome into a per-user library
  - ARCHIVE_URLS=11 GitHub-only packages - CellChat fork, DoubletFinder, GPTCelltype, presto, monocle3, SeuratWrappers, SeuratDisk, genesorteR, hdWGCNA, msigdf, leidenbase
  - BPCells from r/ subdir - monorepo tarball; its DESCRIPTION deps (readr, hexbin) installed first
  - MACOS_BREW_DEPS=openssl@3 hdf5 - inline brew step + ~/.R/Makevars for source builds; dylibs vendored
  - SOURCE_REBUILD=gdtools - static gdtools so no XQuartz link remains
  - PATCH global.R and tfrn1.R - remove startup BSgenome install; lazy ensure_bsgenome per species
  - Vendored scType - scripts and ScTypeDB copied into www/sctype for offline use
  - MAX_REQUEST_MB=4096 and SMOKE_TIMEOUT_SEC=1800 - single-cell uploads and long first load
  - Cairo suffix 9001 reserved - v1.1.2 shipped Cairo unpatched; first rebuild must set PKG_VERSION_PACKAGES=Cairo and PKG_VERSION_SUFFIX=9001

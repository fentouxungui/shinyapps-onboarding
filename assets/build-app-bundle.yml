# =====================================================================
#  ShinyApps app-layer bundle builder (Route A) -- HARDENED v3.
#  Builds prebuilt desktop bundles (win-x64, mac-arm64) for an R/Shiny app
#  and attaches them to a GitHub Release. No shell rebuild. R 4.6.1.
#
#  This is the exmort-review revision, updated after the FielDHub/Familia
#  upstream PR reviews. v3 adds: the smoke test starts shiny::runApp() and
#  requests /; package-fn removes any CRAN copy and verifies the installed
#  DESCRIPTION; httpuv joins the build helpers. v2 added: optional
#  tag/DESCRIPTION version enforcement, one trigger, immutable release assets,
#  fail-fast dependency resolution, an optional CRAN snapshot, a clean-library
#  smoke test, optional pinned Pandoc, least-privilege permissions, and
#  published checksums/metadata.
#
#  Modes (auto-detected when APP_MODE=auto):
#   * flat           - the repo IS the app (app.R, or ui.R+server.R, or legacy
#                      shinyUI/shinyServer). Sources are copied verbatim.
#   * package-fn     - the app is an R package whose exported function returns
#                      a shinyApp object; ENTRY_FN is that call.
#   * package-deploy - the app is a dir inside an R package that reads package
#                      internals; app files are copied + library() lines
#                      prepended + data supplied via an RData.
# =====================================================================
name: Build app bundle

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  APP_ID: "__APP_ID__"
  APP_NAME: "__APP_NAME__"
  APP_AUTHOR: "__APP_AUTHOR__"
  APP_DESC: "__APP_DESC__"
  APP_HOMEPAGE: "__APP_HOMEPAGE__"
  APP_LICENSE: "__APP_LICENSE__"
  APP_MODE: "__APP_MODE__"
  APP_SUBDIR: "__APP_SUBDIR__"
  PKG_SUBDIR: "__PKG_SUBDIR__"
  ENTRY_FN: "__ENTRY_FN__"
  UI_LIBS: "__UI_LIBS__"
  SERVER_LIBS: "__SERVER_LIBS__"
  DEMO_RDA: "__DEMO_RDA__"
  DEMO_OBJECT: "__DEMO_OBJECT__"
  DEMO_SAVE_AS: "__DEMO_SAVE_AS__"
  DEMO_RDATA: "__DEMO_RDATA__"
  EXTRA_PKGS: "__EXTRA_PKGS__"
  EXCLUDE: "__EXCLUDE__"
  ARCHIVE_URLS: "__ARCHIVE_URLS__"
  # Packages that must exist in rlib/ after ARCHIVE_URLS installs; the build
  # fails if one is missing (a silent try() once shipped a broken bundle).
  FORCED_PKGS: "__FORCED_PKGS__"
  EXTRA_REPOS: "__EXTRA_REPOS__"
  SOFT_PKGS: "__SOFT_PKGS__"
  SOURCE_REBUILD: "__SOURCE_REBUILD__"
  # Space-separated Homebrew formulae needed to compile source packages on macOS
  # (e.g. "openssl@3 hdf5"). Build-time only; their dylibs are vendored by the audit.
  MACOS_BREW_DEPS: "__MACOS_BREW_DEPS__"
  # Packages whose installed version gets an app-unique numeric suffix, so the
  # shell's shared library cannot merge app-specific builds (e.g. Cairo with
  # vendored XQuartz dylibs). Set both or neither; see references/special-packages.md.
  PKG_VERSION_PACKAGES: "__PKG_VERSION_PACKAGES__"
  PKG_VERSION_SUFFIX: "__PKG_VERSION_SUFFIX__"
  # Optional R script run inside app/ after assembly, for build-time patches
  # (absolute paths in config files, disabling a module that cannot ship).
  PATCH_SCRIPT: "__PATCH_SCRIPT__"
  PREFETCH_SCRIPT: "__PREFETCH_SCRIPT__"
  APP_NOTES: "__APP_NOTES__"
  MAX_REQUEST_MB: "1024"
  SMOKE: "on"
  SMOKE_TIMEOUT_SEC: "300"
  R_VERSION: "__R_VERSION__"
  # Optional Posit Package Manager date snapshot, e.g. "2026-10-01".
  # Empty = live CRAN. Set it when reproducible dependency inputs matter.
  CRAN_SNAPSHOT: "__CRAN_SNAPSHOT__"
  # auto = enforce tag == DESCRIPTION Version when DESCRIPTION exists;
  # on   = require DESCRIPTION and enforce; off = tag is the store version.
  STRICT_VERSION: "__STRICT_VERSION__"
  # on = missing required/transitive dependencies fail the build.
  STRICT_DEPS: "__STRICT_DEPS__"
  # Non-empty = install and check this Pandoc version (report-rendering apps).
  PANDOC_VERSION: "__PANDOC_VERSION__"

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "win-x64" }
          - { os: macos-14,       platform: "mac-arm64" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2
        if: env.PANDOC_VERSION != ''
        with:
          pandoc-version: ${{ env.PANDOC_VERSION }}

      - name: Verify report toolchain
        if: env.PANDOC_VERSION != ''
        shell: bash
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            echo "::error::PANDOC_VERSION is set but pandoc was not found"
            exit 1
          fi
          pandoc --version | head -n 1

      - name: Install build helpers
        shell: bash
        run: Rscript -e 'install.packages(c("jsonlite","zip","digest","BiocManager","callr","curl","httpuv"), repos="https://cloud.r-project.org")'

      - name: Install macOS build dependencies (optional)
        if: ${{ env.MACOS_BREW_DEPS != '' && runner.os == 'macOS' }}
        shell: bash
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install ${{ env.MACOS_BREW_DEPS }}
          mkdir -p "$HOME/.R"
          pc=""; cpp=""; ld=""
          for f in ${{ env.MACOS_BREW_DEPS }}; do
            p="$(brew --prefix "$f")"
            pc="$p/lib/pkgconfig:$p/share/pkgconfig:$pc"
            cpp="-I$p/include $cpp"
            ld="-L$p/lib $ld"
            printf 'CPPFLAGS += -I%s/include\nLDFLAGS += -L%s/lib\n' "$p" "$p" >> "$HOME/.R/Makevars"
          done
          {
            echo "PKG_CONFIG_PATH=$pc$PKG_CONFIG_PATH"
            echo "CPPFLAGS=$cpp$CPPFLAGS"
            echo "LDFLAGS=$ld$LDFLAGS"
          } >> "$GITHUB_ENV"

      - name: Resolve and validate version
        shell: bash
        run: |
          V="${{ inputs.tag || github.ref_name }}"
          V="${V#v}"
          if [ -z "$V" ]; then
            echo "::error::cannot resolve version from tag"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Assemble bundle (app/ + rlib/ + manifest.json)
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_id  <- Sys.getenv("APP_ID")
          mode    <- Sys.getenv("APP_MODE"); if (!nzchar(mode) || grepl("^__", mode)) mode <- "auto"
          sub_    <- Sys.getenv("APP_SUBDIR"); if (!nzchar(sub_)) sub_ <- "."
          pkg_sub <- Sys.getenv("PKG_SUBDIR"); if (!nzchar(pkg_sub)) pkg_sub <- "."
          root    <- getwd()
          bundle  <- file.path(root, "bundle"); unlink(bundle, recursive = TRUE); dir.create(bundle, recursive = TRUE)
          appdir  <- file.path(bundle, "app"); dir.create(appdir, recursive = TRUE)
          lib     <- file.path(bundle, "rlib"); dir.create(lib, recursive = TRUE)
          .libPaths(c(lib, .libPaths()))
          base_pkgs <- rownames(installed.packages(priority = c("base", "recommended")))
          split_pkgs <- function(x) { p <- strsplit(trimws(x), "[ ,]+")[[1]]; p[nzchar(p)] }
          dcf_deps <- function(dcf, fields = c("Depends","Imports","LinkingTo")) {
            f <- intersect(fields, colnames(dcf)); if (!length(f)) return(character())
            v <- na.omit(unlist(dcf[1, f]))
            v <- trimws(sub("[[:space:]]*\\(.*\\)$", "", trimws(unlist(strsplit(paste(v, collapse = ","), ",")))))
            v[nzchar(v) & v != "R"]
          }
          opt <- function() sprintf("options(shiny.launch.browser = FALSE, shiny.maxRequestSize = %s * 1024^2)", Sys.getenv("MAX_REQUEST_MB"))
          pkgroot <- normalizePath(file.path(root, pkg_sub), winslash = "/", mustWork = FALSE)
          has_pkg <- file.exists(file.path(pkgroot, "DESCRIPTION"))
          strict_version <- tolower(Sys.getenv("STRICT_VERSION")); if (!nzchar(strict_version) || grepl("^__", strict_version)) strict_version <- "auto"
          if (has_pkg) {
            dcf0 <- read.dcf(file.path(pkgroot, "DESCRIPTION"))
            pkg_ver <- unname(dcf0[1, "Version"])
            if (strict_version != "off" && !identical(as.character(pkg_ver), Sys.getenv("VERSION"))) {
              stop("version mismatch: DESCRIPTION Version=", pkg_ver,
                   " but tag/manifest version=", Sys.getenv("VERSION"),
                   ". Retag with v", pkg_ver, " or set STRICT_VERSION=off (and explain in APP_NOTES).")
            }
          } else if (strict_version == "on") {
            stop("STRICT_VERSION=on but no DESCRIPTION was found at ", pkgroot)
          }
          if (mode == "auto") mode <- if (!has_pkg) "flat" else if (nzchar(Sys.getenv("ENTRY_FN"))) "package-fn" else "package-deploy"

          seed <- character(); pkg_name <- ""
          if (mode == "flat") {
            src <- normalizePath(file.path(root, sub_), winslash = "/", mustWork = TRUE)
            for (p in list.files(src, all.files = TRUE, no.. = TRUE, full.names = TRUE))
              if (!basename(p) %in% c(".git", ".github")) file.copy(p, appdir, recursive = TRUE)
            for (e in split_pkgs(Sys.getenv("EXCLUDE"))) { t <- file.path(appdir, e); if (file.exists(t)) unlink(t, recursive = TRUE) }
            if (file.exists(file.path(appdir, "app.R"))) {
              if (any(grepl("runApp[[:space:]]*\\(", readLines(file.path(appdir, "app.R"), warn = FALSE)))) {
                file.rename(file.path(appdir, "app.R"), file.path(appdir, paste0(app_id, "-app.R")))
                writeLines(c(opt(), sprintf("app <- source(\"%s-app.R\")$value", app_id),
                  "if (!inherits(app, \"shiny.appobj\")) stop(\"app.R did not return a shiny app object\")", "app"),
                  file.path(appdir, "app.R"))
              }
            } else if (!file.exists(file.path(appdir, "ui.R"))) stop("flat mode: no app.R or ui.R in ", src)
            sf <- list.files(appdir, pattern = "[.](R|r|Rmd|rmd)$", recursive = TRUE, full.names = TRUE)
            txt <- paste(unlist(lapply(sf, function(f) tryCatch(readLines(f, warn = FALSE), error = function(e) character()))), collapse = "\n")
            grab <- function(pat) { x <- regmatches(txt, gregexpr(pat, txt))[[1]]; if (length(x)) gsub("[()\"']", "", sub(".*?(library|require)", "", x)) else character() }
            seed <- unique(c(grab("library\\([A-Za-z0-9._\"']+"), grab("require\\([A-Za-z0-9._\"']+"),
                             sub("::.*$", "", regmatches(txt, gregexpr("([A-Za-z][A-Za-z0-9._]+)::", txt))[[1]]),
                             split_pkgs(Sys.getenv("EXTRA_PKGS")), "shiny"))
          } else if (mode == "package-fn") {
            dcf <- read.dcf(file.path(pkgroot, "DESCRIPTION")); pkg_name <- unname(dcf[1, "Package"])
            writeLines(c(opt(), Sys.getenv("ENTRY_FN")), file.path(appdir, "app.R"))
            seed <- c(dcf_deps(dcf), split_pkgs(Sys.getenv("EXTRA_PKGS")), pkg_name)
          } else {
            dcf <- read.dcf(file.path(pkgroot, "DESCRIPTION")); pkg_name <- unname(dcf[1, "Package"])
            psrc <- normalizePath(file.path(pkgroot, "inst", sub_), winslash = "/", mustWork = TRUE)
            for (p in list.files(psrc, all.files = TRUE, no.. = TRUE, full.names = TRUE)) file.copy(p, appdir, recursive = TRUE)
            prepend <- function(f, lines) if (file.exists(f) && length(lines)) { txt <- readLines(f, warn = FALSE); writeLines(c(lines, txt), f) }
            rda <- Sys.getenv("DEMO_RDA")
            if (nzchar(rda)) {
              e <- new.env(); load(file.path(root, rda), envir = e)
              save_as <- Sys.getenv("DEMO_SAVE_AS"); if (!nzchar(save_as)) save_as <- ".SHINYSTAN_OBJECT"
              rdata <- Sys.getenv("DEMO_RDATA"); if (!nzchar(rdata)) rdata <- "sso.RData"
              assign(save_as, get(Sys.getenv("DEMO_OBJECT"), envir = e)); save(list = save_as, file = file.path(appdir, rdata))
              prepend(file.path(appdir, "global.R"), sprintf("load(\"%s\")", rdata))
            }
            ui_libs <- split_pkgs(Sys.getenv("UI_LIBS")); srv_libs <- split_pkgs(Sys.getenv("SERVER_LIBS"))
            prepend(file.path(appdir, "ui.R"), paste0("library(", ui_libs, ");"))
            prepend(file.path(appdir, "server.R"), paste0("library(", srv_libs, ");"))
            seed <- unique(c(ui_libs, srv_libs, dcf_deps(dcf), split_pkgs(Sys.getenv("EXTRA_PKGS"))))
          }
          seed <- setdiff(seed, base_pkgs)
          cat("mode:", mode, "| seed:", paste(sort(seed), collapse = ", "), "\n")

          er <- split_pkgs(Sys.getenv("EXTRA_REPOS"))
          snap <- Sys.getenv("CRAN_SNAPSHOT"); if (grepl("^__", snap)) snap <- ""
          cran <- if (nzchar(snap)) sprintf("https://packagemanager.posit.co/cran/%s", snap) else "https://cloud.r-project.org"
          repos <- unique(c(er, cran, BiocManager::repositories())); options(repos = repos)
          db <- available.packages(repos = repos, type = "source")
          soft <- split_pkgs(Sys.getenv("SOFT_PKGS"))
          strict_deps <- tolower(Sys.getenv("STRICT_DEPS")); if (!nzchar(strict_deps) || grepl("^__", strict_deps)) strict_deps <- "on"
          dropped <- setdiff(seed, rownames(db))
          hard_dropped <- setdiff(dropped, soft)
          if (strict_deps == "on" && length(hard_dropped)) stop("unresolved required dependencies: ", paste(hard_dropped, collapse = ", "))
          if (length(dropped)) cat(if (strict_deps == "on") "optional/soft packages not in index:" else "WARN dropped (not in CRAN/Bioc):", paste(dropped, collapse = ", "), "\n")
          seed <- intersect(seed, rownames(db))
          deps <- unlist(tools::package_dependencies(seed, db = db, recursive = TRUE))
          closure_all <- unique(c(seed, deps[!is.na(deps)]))
          closure_missing <- setdiff(closure_all, c(base_pkgs, rownames(db)))
          if (strict_deps == "on" && length(closure_missing)) stop("unresolved transitive dependencies: ", paste(closure_missing, collapse = ", "))
          closure <- if (strict_deps == "on") setdiff(closure_all, base_pkgs) else setdiff(intersect(closure_all, rownames(db)), base_pkgs)
          if (strict_deps != "on" && length(closure_missing)) cat("WARN dropped transitive dependencies:", paste(closure_missing, collapse = ", "), "\n")
          # package-fn installs the app package from the checked-out source
          # below; a CRAN copy must not stand in for a failed local install.
          if (mode == "package-fn" && nzchar(pkg_name)) closure <- setdiff(closure, pkg_name)
          cat("closure size:", length(closure), "\n")

          options(pkgType = "both")
          have <- function() basename(list.dirs(lib, recursive = FALSE))
          ins <- function(p, type = "both", deps = NA) if (length(p)) install.packages(p, lib = lib, repos = repos, type = type, dependencies = deps, Ncpus = 2)
          ins(closure)
          nb <- setdiff(closure, have()); if (length(nb)) { cat("source retry:", length(nb), "\n"); ins(nb, type = "source", deps = FALSE) }
          if (identical(unname(Sys.info()[["sysname"]]), "Darwin")) {
            sr <- split_pkgs(Sys.getenv("SOURCE_REBUILD"))
            if (length(sr)) {
              oldpath <- Sys.getenv("PATH"); old_pc <- Sys.getenv("PKG_CONFIG_PATH"); old_pcl <- Sys.getenv("PKG_CONFIG_LIBDIR")
              pth <- strsplit(oldpath, .Platform$path.sep)[[1]]
              pth <- pth[!grepl("homebrew|linuxbrew", pth, ignore.case = TRUE)]
              Sys.setenv(PATH = paste(pth, collapse = .Platform$path.sep), PKG_CONFIG_PATH = "", PKG_CONFIG_LIBDIR = "")
              cat("macOS source rebuild (Homebrew hidden):", paste(sr, collapse = ", "), "\n")
              on.exit(Sys.setenv(PATH = oldpath, PKG_CONFIG_PATH = old_pc, PKG_CONFIG_LIBDIR = old_pcl), add = TRUE)
              ins(sr, type = "source", deps = FALSE)
              Sys.setenv(PATH = oldpath, PKG_CONFIG_PATH = old_pc, PKG_CONFIG_LIBDIR = old_pcl)
            }
          }
          if (mode == "package-fn") {
            # The app package is installed from the checked-out source, never
            # from CRAN: remove any existing copy and verify the installed
            # DESCRIPTION, so a failed source install cannot be masked by a
            # stale CRAN build.
            unlink(file.path(lib, pkg_name), recursive = TRUE)
            err <- tryCatch({
              install.packages(pkgroot, lib = lib, repos = NULL, type = "source", dependencies = FALSE)
              NULL
            }, error = function(e) e)
            if (!is.null(err)) stop("app package install error: ", conditionMessage(err))
            installed <- tryCatch(read.dcf(file.path(lib, pkg_name, "DESCRIPTION")), error = function(e) NULL)
            if (is.null(installed)) stop("app package failed to install from source: ", pkg_name)
            if (!identical(unname(installed[1, "Version"]), unname(dcf[1, "Version"])))
              stop("installed app package version ", installed[1, "Version"],
                   " does not match the source version ", dcf[1, "Version"])
          }
          install_archive <- function(u) {
            f <- file.path(tempdir(), basename(u)); download.file(u, f, mode = "wb", quiet = TRUE)
            if (!file.exists(f) || file.size(f) < 1000) stop("ARCHIVE_URLS download failed: ", u)
            pkgdir <- f
            if (!file.exists(file.path(f, "DESCRIPTION"))) {
              # A monorepo tarball may hold the package in a subdirectory (e.g. BPCells in r/).
              ex <- file.path(tempdir(), paste0("x-", basename(u))); unlink(ex, recursive = TRUE); dir.create(ex)
              if (grepl("[.]zip$", u, ignore.case = TRUE)) utils::unzip(f, exdir = ex) else utils::untar(f, exdir = ex)
              d <- list.files(ex, pattern = "^DESCRIPTION$", recursive = TRUE, full.names = TRUE)
              d <- d[!grepl("([.]Rcheck|/tests?/|/vignettes?/|/data/)", gsub("\\\\", "/", d))]
              if (length(d) != 1) stop("ARCHIVE_URLS: expected one package DESCRIPTION inside ", basename(u), ", found ", length(d), ". Use a package tarball or install it in a manual step.")
              pkgdir <- dirname(d)
              cat("archive subdirectory:", basename(pkgdir), "\n")
            }
            dcf <- tryCatch(read.dcf(file.path(pkgdir, "DESCRIPTION")), error = function(e) NULL)
            if (!is.null(dcf)) {
              need <- setdiff(dcf_deps(dcf), c(have(), base_pkgs))
              need <- intersect(need, rownames(db))
              if (length(need)) { cat("archive deps:", paste(need, collapse = ", "), "\n"); ins(need, deps = FALSE) }
            }
            install.packages(pkgdir, lib = lib, repos = NULL, type = "source", dependencies = FALSE)
          }
          for (u in split_pkgs(Sys.getenv("ARCHIVE_URLS"))) {
            cat("installing archived package:", basename(u), "\n"); install_archive(u)
          }
          forced <- split_pkgs(Sys.getenv("FORCED_PKGS"))
          forced_missing <- setdiff(forced, have())
          if (length(forced_missing)) stop("forced packages were not installed from ARCHIVE_URLS: ", paste(forced_missing, collapse = ", "))
          if (length(forced)) cat("forced packages ok:", paste(forced, collapse = ", "), "\n")

          for (i in 1:5) {
            installed <- have(); need <- character()
            for (p in installed) { d <- tryCatch(read.dcf(file.path(lib, p, "DESCRIPTION")), error = function(e) NULL); if (!is.null(d)) need <- c(need, dcf_deps(d)) }
            need <- setdiff(unique(intersect(need, rownames(db))), c(installed, base_pkgs))
            if (!length(need)) break
            cat("fix-up round", i, ":", paste(need, collapse = ", "), "\n"); ins(need)
          }

          if (identical(unname(Sys.info()[["sysname"]]), "Darwin")) {
            bins <- list.files(lib, pattern = "[.](so|dylib)$", recursive = TRUE, full.names = TRUE); bad <- character()
            for (b in bins) { o <- suppressWarnings(system2("otool", c("-L", shQuote(b)), stdout = TRUE, stderr = FALSE)); if (any(grepl("(/opt/X11|/opt/homebrew|/usr/local/opt)", o))) bad <- c(bad, b) }
            if (length(bad)) stop("non-portable dylib references in ", length(bad), " file(s): ", paste(unique(basename(bad)), collapse = ", "), ". Rebuild with SOURCE_REBUILD=<pkg>, or drop the package/feature; see references/macos-portability.md")
          }

          required <- setdiff(seed, c(soft, base_pkgs)); miss <- setdiff(required, have())
          if (length(miss) && strict_deps == "on") stop("missing required packages: ", paste(miss, collapse = ", "))
          for (p in required) { ok <- tryCatch({ loadNamespace(p, lib.loc = lib); TRUE }, error = function(e) { cat("LOAD FAILED:", p, "->", conditionMessage(e), "\n"); FALSE }); if (!ok) stop("seed package cannot be loaded from rlib: ", p) }

          # Every package named in a library()/require()/pkg:: call must be in rlib.
          # The smoke test builds the UI only, so a package loaded inside a click
          # handler would otherwise stay invisible until a user presses the button.
          declared_pkgs <- function(dir) {
            sf <- list.files(dir, pattern = "[.](R|r|Rmd|rmd)$", recursive = TRUE, full.names = TRUE)
            lines <- unlist(lapply(sf, function(f) tryCatch(sub("#.*$", "", readLines(f, warn = FALSE)), error = function(e) character())))
            txt <- paste(lines, collapse = "\n")
            g <- function(pat) { x <- regmatches(txt, gregexpr(pat, txt))[[1]]; if (length(x)) unique(gsub("[()\"' ]", "", sub(".*?(library|require)", "", x))) else character() }
            unique(c(g("library\\([A-Za-z0-9._]+"), g("require\\([A-Za-z0-9._]+"),
                     sub("::.*$", "", regmatches(txt, gregexpr("([A-Za-z][A-Za-z0-9._]+)::", txt))[[1]])))
          }
          used <- setdiff(declared_pkgs(appdir), c(base_pkgs, soft))
          not_bundled <- setdiff(used, have())
          if (length(not_bundled)) stop("packages referenced by the app sources are not in rlib: ", paste(not_bundled, collapse = ", "), ". Add them to EXTRA_PKGS/SOFT_PKGS, or install them via ARCHIVE_URLS + FORCED_PKGS.")
          cat("source-declared packages ok:", length(used), "\n")
          soft_missing <- setdiff(intersect(soft, seed), c(have(), base_pkgs))
          cat("rlib packages:", length(have()), "| soft missing:", paste(soft_missing, collapse = ","), "\n")

          pvpkgs <- split_pkgs(Sys.getenv("PKG_VERSION_PACKAGES"))
          pvsuf <- trimws(Sys.getenv("PKG_VERSION_SUFFIX"))
          if (length(pvpkgs)) {
            if (!nzchar(pvsuf) || !grepl("^[0-9]+$", pvsuf)) stop("PKG_VERSION_PACKAGES is set but PKG_VERSION_SUFFIX is not a numeric suffix")
            for (p in pvpkgs) {
              dfile <- file.path(lib, p, "DESCRIPTION")
              if (!file.exists(dfile)) stop("PKG_VERSION_PACKAGES: ", p, " is not in rlib")
              d <- read.dcf(dfile)
              d[1, "Version"] <- paste0(d[1, "Version"], ".", pvsuf)
              write.dcf(d, file = dfile)
              cat("app-specific version:", p, "->", d[1, "Version"], "\n")
            }
          }

          entry <- if (file.exists(file.path(appdir, "app.R"))) "app/app.R" else "app/ui.R"
          pkgs <- as.data.frame(installed.packages(lib.loc = lib), stringsAsFactors = FALSE)
          platform <- "${{ matrix.platform }}"
          lock <- data.frame(package = pkgs$Package, version = pkgs$Version, stringsAsFactors = FALSE)
          lock <- lock[order(lock$package), ]
          lock_file <- sprintf("deps-%s.json", platform)
          jsonlite::write_json(lock, file.path(root, lock_file), pretty = TRUE, auto_unbox = TRUE)
          lock_sha <- digest::digest(file.path(root, lock_file), algo = "sha256", file = TRUE)
          notes <- Sys.getenv("APP_NOTES"); if (length(soft_missing)) notes <- paste0(notes, " Not bundled: ", paste(soft_missing, collapse = ", "), ".")
          man <- list(schema = 1L, id = app_id, name = Sys.getenv("APP_NAME"), version = Sys.getenv("VERSION"),
            author = Sys.getenv("APP_AUTHOR"), description = Sys.getenv("APP_DESC"), homepage = Sys.getenv("APP_HOMEPAGE"),
            license = Sys.getenv("APP_LICENSE"), runtime = "r-shiny", entry = entry, platform = platform,
            r_version = Sys.getenv("R_VERSION"), min_shell_version = "0.1.0", notes = notes,
            packages = lapply(seq_len(nrow(pkgs)), function(i) list(name = pkgs$Package[i], version = pkgs$Version[i], path = file.path("rlib", pkgs$Package[i]), source = "cran")))
          jsonlite::write_json(man, file.path(bundle, "manifest.json"), pretty = TRUE, auto_unbox = TRUE)

      - name: Patch app for a desktop bundle (optional)
        if: ${{ env.PATCH_SCRIPT != '' }}
        shell: Rscript {0}
        run: |
          root   <- getwd()
          script <- file.path(root, Sys.getenv("PATCH_SCRIPT"))
          if (!file.exists(script)) stop("PATCH_SCRIPT not found: ", script)
          appdir <- file.path(root, "bundle", "app")
          .libPaths(c(file.path(root, "bundle", "rlib"), .libPaths()))
          old <- setwd(appdir); on.exit(setwd(old), add = TRUE)
          source(script)
          cat("patch done\n")

      - name: Prefetch first-launch data (optional)
        if: ${{ env.PREFETCH_SCRIPT != '' }}
        timeout-minutes: 45
        shell: Rscript {0}
        run: |
          root   <- getwd()
          script <- file.path(root, Sys.getenv("PREFETCH_SCRIPT"))
          if (!file.exists(script)) stop("PREFETCH_SCRIPT not found: ", script)
          appdir <- file.path(root, "bundle", "app")
          .libPaths(c(file.path(root, "bundle", "rlib"), .libPaths()))
          options(timeout = 3600)
          old <- setwd(appdir); on.exit(setwd(old), add = TRUE)
          source(script)
          cat("prefetch done; files under the app dir:\n")
          print(list.files(".", recursive = TRUE, pattern = "[.](txt|tsv|rds|rda|sqlite)$"))

      - name: Zip + sha256 + metadata + size guard
        shell: Rscript {0}
        run: |
          platform <- "${{ matrix.platform }}"
          out <- sprintf("%s-%s-%s.zip", Sys.getenv("APP_ID"), Sys.getenv("VERSION"), platform)
          bundle <- file.path(getwd(), "bundle"); old <- setwd(bundle); on.exit(setwd(old))
          zip::zipr(out, files = list.files(".", all.files = TRUE, no.. = TRUE))
          entries <- utils::unzip(out, list = TRUE)$Name
          if (!any(grepl("^rlib/", entries))) stop("zip is missing rlib/ -- aborting")
          if (!any(grepl("^app/(app[.]R|ui[.]R)$", entries))) stop("zip is missing app/app.R or app/ui.R -- aborting")
          setwd(old); file.rename(file.path(bundle, out), out)
          sha <- digest::digest(out, algo = "sha256", file = TRUE); sz <- file.size(out)
          cat("bundle zip size (bytes):", sz, "\n")
          if (sz > 2 * 1024^3) stop("bundle exceeds the 2 GiB GitHub Release asset limit; trim modules or use a smaller closure.")
          lock_file <- sprintf("deps-%s.json", platform)
          lock_sha <- if (file.exists(lock_file)) digest::digest(lock_file, algo = "sha256", file = TRUE) else NA_character_
          pv <- Sys.getenv("PANDOC_VERSION"); if (grepl("^__", pv)) pv <- ""
          if (nzchar(pv)) {
            found <- tryCatch(system2("pandoc", "--version", stdout = TRUE, stderr = FALSE)[1], error = function(e) NA_character_)
            if (is.na(found) || !nzchar(found)) stop("PANDOC_VERSION is set but pandoc was not found on PATH")
            pv <- found
          } else {
            pv <- NA_character_
          }
          meta <- list(
            schema = 1L, app_id = Sys.getenv("APP_ID"), platform = platform,
            version = Sys.getenv("VERSION"), file = out, sha256 = sha, size = sz,
            source_repository = Sys.getenv("GITHUB_REPOSITORY"), source_commit = Sys.getenv("GITHUB_SHA"),
            source_ref = Sys.getenv("GITHUB_REF"), source_tag = Sys.getenv("TAG"),
            r_version = Sys.getenv("R_VERSION"), cran_snapshot = Sys.getenv("CRAN_SNAPSHOT"),
            strict_version = Sys.getenv("STRICT_VERSION"), strict_deps = Sys.getenv("STRICT_DEPS"),
            pandoc_version = pv, dependency_lock = lock_file, dependency_lock_sha256 = lock_sha,
            package_count = nrow(utils::installed.packages(lib.loc = file.path("bundle", "rlib")))
          )
          jsonlite::write_json(meta, sprintf("meta-%s.json", platform), pretty = TRUE, auto_unbox = TRUE)
          writeLines(sprintf("%s  %s", sha, out), sprintf("meta-%s.sha256", platform))

      - name: Smoke test (launch the bundle like the ShinyApps shell)
        if: ${{ env.SMOKE != 'off' }}
        timeout-minutes: 12
        shell: Rscript {0}
        run: |
          app_id <- Sys.getenv("APP_ID"); ver <- Sys.getenv("VERSION"); plat <- "${{ matrix.platform }}"
          zip <- sprintf("%s-%s-%s.zip", app_id, ver, plat)
          if (!file.exists(zip)) stop("smoke: bundle not found: ", zip)
          tmp <- tempfile("smoke"); dir.create(tmp)
          utils::unzip(zip, exdir = tmp)
          appdir <- file.path(tmp, "app"); lib <- file.path(tmp, "rlib")
          if (!dir.exists(appdir) || !dir.exists(lib)) stop("smoke: unexpected bundle layout")
          timeout <- suppressWarnings(as.integer(Sys.getenv("SMOKE_TIMEOUT_SEC", "300"))); if (is.na(timeout) || timeout < 30) timeout <- 300
          # Start the app in a child process with a clean library and request
          # its root page. Constructing the app object is not enough: a ui
          # function or a startup hook can fail only once the server runs.
          serve <- function(appdir, lib, port) {
            .libPaths(c(lib, .Library))
            if (!identical(normalizePath(.libPaths()[1], winslash = "/", mustWork = TRUE),
                           normalizePath(lib, winslash = "/", mustWork = TRUE))) {
              stop("smoke: bundle rlib is not first on .libPaths()")
            }
            allowed <- normalizePath(c(lib, .Library), winslash = "/", mustWork = TRUE)
            actual <- normalizePath(.libPaths(), winslash = "/", mustWork = FALSE)
            extra <- setdiff(actual, allowed)
            if (length(extra)) stop("smoke: unexpected library paths: ", paste(extra, collapse = ", "))
            old <- setwd(appdir); on.exit(setwd(old), add = TRUE)
            shiny::runApp(".", port = port, host = "127.0.0.1",
                          launch.browser = FALSE, quiet = TRUE)
          }
          port <- httpuv::randomPort()
          proc <- callr::r_bg(serve, args = list(appdir = appdir, lib = lib, port = port),
                              supervise = TRUE)
          on.exit(try(proc$kill(), silent = TRUE), add = TRUE)
          url <- sprintf("http://127.0.0.1:%d/", port)
          deadline <- Sys.time() + timeout
          out <- character()
          repeat {
            out <- c(out, proc$read_output_lines(), proc$read_error_lines())
            if (!proc$is_alive()) {
              cat(paste(out, collapse = "\n"), "\n")
              stop("smoke test FAILED: the app exited before serving a page")
            }
            served <- tryCatch({
              h <- curl::new_handle(connecttimeout = 5L, timeout = 10L)
              r <- curl::curl_fetch_memory(url, handle = h)
              r$status_code == 200L && length(r$content) > 0 &&
                grepl("<!doctype|<html", rawToChar(r$content), ignore.case = TRUE)
            }, error = function(e) FALSE)
            if (isTRUE(served)) break
            if (Sys.time() >= deadline) {
              cat(paste(out, collapse = "\n"), "\n")
              stop("smoke test FAILED: ", url, " did not serve a page within ", timeout, "s")
            }
            Sys.sleep(1)
          }
          cat("SMOKE OK:", url, "served an HTML page\n")

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            *.zip
            *.sha256
            meta-*.json
            deps-*.json

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Refuse to overwrite published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for f in artifacts/*; do
              n="$(basename "$f")"
              if printf '%s\n' "$existing" | grep -qxF "$n"; then
                echo "::error::release asset already exists: $n"
                exit 1
              fi
            done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/meta-*.json
            artifacts/deps-*.json
          overwrite_assets: false
          fail_on_unmatched_files: true
          generate_release_notes: false
